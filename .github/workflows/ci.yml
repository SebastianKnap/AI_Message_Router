name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # e2e requires a live Ollama + Mailpit stack, which CI does not run -
      # see README for how to run the full suite locally.
      - name: Unit tests
        run: pytest tests/ -m "not e2e"
